<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do It</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To Do It</h1>
        <div class="stats">
          <div class="stat">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
          </div>
          <div class="stat">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
          </div>
          <div class="stat">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
          </div>
          <div class="stat">
            <h3>Progress</h3>
            <p id="progressPercent">0%</p>
          </div>
        </div>
      </header>

      <section class="add-task">
        <input type="text" id="taskInput" placeholder="Add a todo..." />
        <input type="date" id="dueDate" />
        <button id="addTaskBtn">+</button>
      </section>

      <section class="controls">
        <input
          type="text"
          id="searchInput"
          placeholder="Search tasks... (Ctrl+F)"
        />
        <select id="filterSelect">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
        <button id="deleteAllBtn">Delete All</button>
        <button id="shortcutBtn">?</button>
      </section>

      <table id="taskTable">
        <thead>
          <tr>
            <th>Task</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="taskList"></tbody>
      </table>
    </div>

    <!-- Shortcut Popup -->
    <div class="popup" id="shortcutPopup">
      <div class="popup-content">
        <h2>Keyboard Shortcuts</h2>
        <ul>
          <li><b>Ctrl + N</b> → Add new task</li>
          <li><b>Ctrl + F</b> → Search tasks</li>
          <li><b>Ctrl + A</b> → Show all tasks</li>
          <li><b>Escape</b> → Cancel operation</li>
          <li><b>Enter</b> → Add task (from input)</li>
        </ul>
        <button id="closePopup">Close</button>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
